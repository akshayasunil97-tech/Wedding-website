<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ashly & Esther | Forever Journey</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #091b38;
    color: white;
    font-family: 'Cormorant Garamond', serif;
}

:root {
    --navy: #091b38;
    --gold: #d6ad62;
    --white: #fffdf8;
}

/* OPENING SCREEN */

.hero {
    height: 100vh;
    min-height: 650px;
    position: relative;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: linear-gradient(
        to bottom,
        #091b38,
        #142d50,
        #091b38
    );
}

.hero-content {
    position: relative;
    z-index: 5;
    padding: 20px;
    animation: appear 2s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.anchor {
    font-size: 65px;
    color: var(--gold);
}

.small-title {
    letter-spacing: 4px;
    color: var(--gold);
    font-size: 13px;
    margin-top: 20px;
}

.hero h1 {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(65px, 12vw, 105px);
    color: var(--gold);
    font-weight: normal;
    margin: 25px 0;
}

.hero p {
    letter-spacing: 3px;
    line-height: 2;
}

.open-btn {
    margin-top: 35px;
    padding: 15px 35px;
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    letter-spacing: 3px;
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
}

/* OCEAN */

.ocean {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 23%;
    background: linear-gradient(
        #24466b,
        #07152b
    );
    border-top: 2px solid #b99758;
}

.wave {
    position: absolute;
    top: -12px;
    height: 25px;
    width: 200%;
    border-radius: 50%;
    background: #315477;
    animation: waves 7s ease-in-out infinite alternate;
}

@keyframes waves {
    to {
        transform: translateX(-20px);
    }
}

.ship {
    position: absolute;
    bottom: 12%;
    left: -150px;
    font-size: 65px;
    animation: sailing 15s linear infinite;
}

@keyframes sailing {
    from { left: -150px; }
    to { left: 110%; }
}

/* INVITATION */

#invitation {
    display: none;
}

.section {
    padding: 85px 20px;
    text-align: center;
}

.white-section {
    background: var(--white);
    color: var(--navy);
}

.gold-title {
    color: var(--gold);
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
}

    font-size: 58px;
    font-weight: normal;
    color: var(--gold
